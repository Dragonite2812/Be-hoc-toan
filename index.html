<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bé Học Toán</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bé học toán">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fff6df">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
  /* Bố cục: một màn hình, khối đề bài ở giữa, bàn phím to ở dưới cho ngón tay bé.
     Giao diện chủ ý dùng một bộ màu sáng tươi dành cho trẻ em. */
  :root {
    color-scheme: light;
    --bg: #fff6df;
    --card: #ffffff;
    --ink: #33305a;
    --soft: #8b86ab;
    --blue: #3d9bff;
    --green: #2fbf71;
    --red: #ff6464;
    --orange: #ff9f1c;
    --purple: #8f5cff;
    --chip: #e4def5;
    --shadow: 0 6px 0 rgba(51, 48, 90, 0.16);
    --display: "Baloo 2", "Arial Rounded MT Bold", "Segoe UI", system-ui, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--display); font-size: 18px;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation; overflow: hidden;
  }
  button { font-family: inherit; touch-action: manipulation; }
  button:focus-visible, select:focus-visible { outline: 4px solid var(--orange); outline-offset: 3px; }

  .screen {
    height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding-block: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .center { max-width: 980px; margin: 0 auto; text-align: center; }

  .btn {
    border: none; cursor: pointer; font-weight: 800; color: #fff;
    border-radius: 22px; box-shadow: var(--shadow);
    transition: transform .08s, box-shadow .08s;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(51,48,90,.16); }

  /* ---------- Trang chính ---------- */
  .langToggle { display: flex; justify-content: center; gap: 10px; margin: 2px 0 6px; }
  .langBtn {
    background: var(--chip); color: var(--ink); font-size: 20px; padding: 6px 18px;
    border-radius: 999px; box-shadow: 0 3px 0 rgba(51,48,90,.14);
  }
  .langBtn.sel { background: var(--purple); color: #fff; }
  h1 { font-size: clamp(42px, 8vw, 78px); line-height: 1; margin: 8px 0 6px; color: var(--purple); }
  .sub { font-size: clamp(20px, 3vw, 26px); color: var(--soft); margin: 0 0 18px; font-weight: 500; }
  .levelNow {
    display: inline-block; background: var(--card); border-radius: 999px; padding: 4px 18px;
    font-size: clamp(17px, 2.4vw, 22px); font-weight: 700; color: var(--purple); margin-bottom: 16px;
    box-shadow: 0 3px 0 rgba(51,48,90,.12);
  }
  .modes { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; margin-bottom: 8px; transition: opacity .2s; }
  .modes.dim { opacity: .35; pointer-events: none; }
  .modeNote { font-size: 17px; color: var(--soft); min-height: 1.4em; margin-bottom: 12px; }
  .mode {
    flex: 1 1 200px; max-width: 260px; padding: 16px 10px 12px;
    font-size: clamp(22px, 3vw, 30px); background: var(--chip); color: var(--ink);
  }
  .mode.sel { background: var(--blue); color: #fff; }
  .mode .big { display: block; font-size: clamp(44px, 7vw, 64px); line-height: 1.1; }
  .start { font-size: clamp(32px, 5vw, 44px); padding: 14px 64px; background: var(--green); }

  .settings {
    margin: 24px auto 8px; max-width: 660px; background: var(--card);
    border-radius: 20px; padding: 16px 20px; text-align: left; box-shadow: var(--shadow);
    font-weight: 500;
  }
  .settings h3 { margin: 0 0 6px; font-size: 20px; color: var(--soft); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 7px 0; font-size: 20px; }
  .row label { min-width: 0; }
  .row select {
    font-size: 17px; padding: 6px 8px; border-radius: 10px; font-family: inherit; color: var(--ink);
    background: var(--card); border: 2px solid var(--chip); max-width: 62%;
  }
  .row input[type=checkbox] { width: 28px; height: 28px; accent-color: var(--blue); flex: none; }
  .voiceStatus { font-size: 16px; color: var(--soft); line-height: 1.35; min-width: 0; }
  .voiceStatus.ok { color: var(--green); }
  .voiceStatus.warn { color: var(--red); }
  .testBtn { background: var(--purple); font-size: 18px; padding: 8px 16px; border-radius: 14px; flex: none; box-shadow: 0 3px 0 rgba(51,48,90,.16); }
  .tip { font-size: 15px; color: var(--soft); margin: 8px 0 0; line-height: 1.4; }

  /* ---------- Làm bài ---------- */
  #game { display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; max-width: 980px; width: 100%; margin: 0 auto 8px; }
  .home { background: var(--soft); font-size: 22px; padding: 8px 18px; }
  .progress { font-size: clamp(22px, 3vw, 30px); font-weight: 800; }
  .rightTop { display: flex; align-items: center; gap: 14px; }
  .speakBtn { font-size: 26px; line-height: 1; padding: 8px 12px; background: var(--orange); border-radius: 16px; }
  .stars { font-size: clamp(22px, 3vw, 30px); font-weight: 800; color: var(--orange); }
  .stars.bump { animation: bump .5s; }
  @keyframes bump { 0%,100% { transform: scale(1); } 40% { transform: scale(1.6); } }
  .bar { height: 14px; background: #efe5c8; border-radius: 10px; max-width: 980px; width: 100%; margin: 0 auto 12px; overflow: hidden; flex: none; }
  .bar div { height: 100%; width: 0; background: var(--orange); transition: width .3s; }

  .play { flex: 1 0 auto; max-width: 980px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .problem {
    width: 100%; background: var(--card); border-radius: 30px; box-shadow: var(--shadow);
    padding: 12px 12px; text-align: center; font-weight: 800;
  }
  .eqline { width: 100%; white-space: nowrap; overflow: hidden; line-height: 1.12; padding: 6px 0; }
  .eqline.big { font-size: min(16vw, 15vh, 140px); }
  .eqline.mid { font-size: min(14vw, 11vh, 110px); }
  .eqline .op { color: var(--purple); margin: 0 .12em; }
  .answer {
    display: inline-block; min-width: 1.5em; padding: 0 .12em;
    border: 6px dashed var(--blue); border-radius: 26px; color: var(--blue);
    vertical-align: middle; line-height: 1.08; text-align: center;
  }
  .answer.sign { min-width: 1.2em; margin: 0 .12em; }
  .answer.ok { border-style: solid; border-color: var(--green); color: var(--green); animation: grow .5s; }
  .answer.bad { border-style: solid; border-color: var(--red); color: var(--red); animation: shake .4s; }
  .answer.reveal { border-style: solid; border-color: var(--orange); color: var(--orange); }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-12px); } 75% { transform: translateX(12px); } }
  @keyframes grow { 0%,100% { transform: scale(1); } 50% { transform: scale(1.2); } }

  .countPic {
    display: grid; grid-template-columns: repeat(5, auto); justify-content: center;
    gap: 2px 12px; font-size: min(8.5vw, 8vh, 76px); line-height: 1.15; padding-top: 4px;
  }
  .wpText {
    font-size: clamp(21px, 3.1vw, 34px); font-weight: 700; line-height: 1.35;
    max-width: 30em; margin: 4px auto 6px; text-wrap: balance;
  }
  .wpPic { font-size: clamp(26px, 3.8vw, 42px); line-height: 1.25; }
  .wpPic .group { display: inline-block; margin: 0 8px; vertical-align: middle; }
  .wpPic .sign { color: var(--purple); vertical-align: middle; }
  .gone { opacity: .25; }

  .feedback { font-size: clamp(24px, 4vw, 40px); font-weight: 800; min-height: 1.3em; line-height: 1.3; text-align: center; }
  .feedback.ok { color: var(--green); }
  .feedback.bad { color: var(--red); }
  .feedback.info { color: var(--orange); }

  .hint { min-height: 1.3em; font-size: clamp(26px, 4.2vw, 44px); line-height: 1.25; text-align: center; }
  .hint .group { display: inline-block; margin: 0 10px; vertical-align: middle; }
  .hint .sign { font-weight: 800; color: var(--purple); vertical-align: middle; }
  .hint .eqHint { font-weight: 800; color: var(--purple); font-size: 1.2em; }
  .hint .numbered { display: inline-flex; flex-direction: column; align-items: center; margin: 0 4px; line-height: 1; }
  .hint .numbered b { font-size: .55em; color: var(--blue); margin-top: 2px; }

  .keypad { margin-top: auto; width: 100%; max-width: 820px; display: grid; gap: 12px; padding-bottom: 6px; }
  #numpad { grid-template-columns: repeat(5, 1fr); }
  #cmppad { grid-template-columns: repeat(3, 1fr); max-width: 640px; }
  .key { height: min(11vh, 96px); min-height: 60px; font-size: clamp(34px, 5vw, 52px); background: var(--blue); }
  .key.hintbtn { grid-column: span 2; background: var(--purple); font-size: clamp(22px, 3vw, 32px); }
  #cmppad .key.hintbtn { grid-column: span 3; }
  .key.del { background: var(--orange); font-size: clamp(26px, 4vw, 38px); }
  .key.go { grid-column: span 2; background: var(--green); font-size: clamp(24px, 3.4vw, 36px); }
  .key.signKey {
    height: min(14vh, 116px); min-height: 76px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; line-height: 1; font-size: clamp(44px, 6.5vw, 68px);
  }
  .key.signKey .lbl { font-size: clamp(14px, 1.9vw, 19px); font-weight: 700; margin-top: 4px; opacity: .95; }

  /* ---------- Hiệu ứng ăn mừng ---------- */
  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 50; overflow: hidden; }
  .burst {
    position: absolute; left: 0; right: 0; top: 38%; transform-origin: center;
    text-align: center; font-size: min(34vw, 34vh, 280px); line-height: 1; margin-top: -.5em;
    animation: pop 1.9s ease-out forwards;
    filter: drop-shadow(0 10px 16px rgba(0,0,0,.18));
  }
  .burst.small { font-size: min(22vw, 22vh, 180px); animation-duration: 1.4s; }
  .burstText {
    position: absolute; left: 16px; right: 16px; top: 64%; text-align: center;
    font-size: clamp(36px, 6vw, 68px); font-weight: 800; color: var(--green); line-height: 1.1;
    text-shadow: 0 4px 0 #fff, 0 0 20px #fff;
    animation: rise 1.9s ease-out forwards;
  }
  @keyframes pop {
    0% { transform: scale(0) rotate(-20deg); opacity: 0; }
    18% { transform: scale(1.25) rotate(8deg); opacity: 1; }
    30% { transform: scale(.95) rotate(-6deg); }
    42% { transform: scale(1.08) rotate(4deg); }
    54% { transform: scale(1) rotate(-3deg); }
    66% { transform: scale(1.05) rotate(2deg); }
    82% { transform: scale(1) rotate(0); opacity: 1; }
    100% { transform: scale(1.3); opacity: 0; }
  }
  @keyframes rise {
    0% { transform: translateY(40px); opacity: 0; }
    20% { transform: translateY(0); opacity: 1; }
    80% { opacity: 1; }
    100% { transform: translateY(-20px); opacity: 0; }
  }
  .confetti {
    position: absolute; top: -30px; width: 14px; height: 22px; border-radius: 3px;
    animation-name: fall; animation-timing-function: linear; animation-fill-mode: forwards;
  }
  .confetti.emo { width: auto; height: auto; font-size: 40px; }
  @keyframes fall {
    0% { transform: translateY(0) rotate(0); opacity: 1; }
    85% { opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  /* ---------- Kết quả ---------- */
  .result { font-size: clamp(34px, 6vw, 58px); font-weight: 800; margin: 14px 0 6px; }
  .bigstars { font-size: clamp(64px, 11vw, 100px); margin: 6px 0 14px; letter-spacing: 6px; }
  .bigstars span { display: inline-block; animation: pop 1s ease-out both; }
  .mistakes { font-size: clamp(22px, 3.4vw, 30px); color: var(--soft); margin-bottom: 24px; line-height: 1.6; }
  .mistakes b { color: var(--ink); margin: 0 8px; white-space: nowrap; }
  .endBtns { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; }
  .again, .back { font-size: clamp(26px, 4vw, 36px); padding: 14px 40px; }
  .again { background: var(--green); }
  .back { background: var(--soft); }

  @media (prefers-reduced-motion: reduce) {
    .burst, .burstText, .bigstars span, .answer.ok, .answer.bad, .stars.bump { animation-duration: .01s !important; }
    .confetti { display: none; }
  }
</style>
</head>
<body>

<div id="fx"></div>

<!-- TRANG CHÍNH -->
<section id="home" class="screen">
  <div class="center">
    <div class="langToggle">
      <button class="btn langBtn" id="langVi" data-lang="vi">🇻🇳 Tiếng Việt</button>
      <button class="btn langBtn" id="langEn" data-lang="en">🇬🇧 English</button>
    </div>
    <h1 data-t="title">Bé Học Toán 🧮</h1>
    <p class="sub" data-t="subtitle">Chọn phép tính rồi bấm Bắt đầu nhé!</p>
    <div class="levelNow" id="levelNow"></div>

    <div class="modes" id="modes">
      <button class="btn mode" id="modeAdd" data-mode="add"><span class="big">➕</span><span data-t="add">Phép cộng</span></button>
      <button class="btn mode" id="modeSub" data-mode="sub"><span class="big">➖</span><span data-t="subtract">Phép trừ</span></button>
      <button class="btn mode" id="modeMix" data-mode="mix"><span class="big">➕➖</span><span data-t="mix">Cả hai</span></button>
    </div>
    <div class="modeNote" id="modeNote"></div>

    <button class="btn start" id="startBtn">▶ <span data-t="start">Bắt đầu</span></button>

    <div class="settings">
      <h3>⚙ <span data-t="settings">Cài đặt cho bố mẹ</span></h3>
      <div class="row">
        <label for="optLevel" data-t="levelLabel">Cấp độ</label>
        <select id="optLevel"></select>
      </div>
      <div class="row">
        <label for="optCount" data-t="countLabel">Số câu mỗi lượt</label>
        <select id="optCount"></select>
      </div>
      <div class="row"><label for="optHint" data-t="alwaysHint">Luôn hiện hình để đếm</label><input type="checkbox" id="optHint"></div>
      <div class="row"><label for="optSound" data-t="soundLabel">Nhạc và tiếng vỗ tay</label><input type="checkbox" id="optSound"></div>
      <div class="row"><label for="optVoice" data-t="voiceLabel">Giọng nói khen</label><input type="checkbox" id="optVoice"></div>
      <div class="row"><label for="optReadQ" data-t="readQLabel">Đọc to đề bài</label><input type="checkbox" id="optReadQ"></div>
      <div class="row">
        <span class="voiceStatus" id="voiceStatus"></span>
        <button class="btn testBtn" id="testVoice">🔊 <span data-t="test">Nghe thử</span></button>
      </div>
      <p class="tip" data-t="tip"></p>
    </div>
  </div>
</section>

<!-- LÀM BÀI -->
<section id="game" class="screen" hidden>
  <div class="topbar">
    <button class="btn home" id="homeBtn">🏠 <span data-t="home">Về</span></button>
    <div class="progress" id="progress"></div>
    <div class="rightTop">
      <button class="btn speakBtn" id="speakBtn" aria-label="Đọc lại đề">🔊</button>
      <div class="stars" id="stars">⭐ 0</div>
    </div>
  </div>
  <div class="bar"><div id="barFill"></div></div>

  <div class="play">
    <div class="problem" id="problem"></div>
    <div class="feedback" id="feedback"></div>
    <div class="hint" id="hint"></div>

    <div class="keypad" id="numpad">
      <button class="btn key" data-k="1">1</button><button class="btn key" data-k="2">2</button><button class="btn key" data-k="3">3</button><button class="btn key" data-k="4">4</button><button class="btn key" data-k="5">5</button>
      <button class="btn key" data-k="6">6</button><button class="btn key" data-k="7">7</button><button class="btn key" data-k="8">8</button><button class="btn key" data-k="9">9</button><button class="btn key" data-k="0">0</button>
      <button class="btn key hintbtn" data-k="hint">💡 <span data-t="hint">Gợi ý</span></button><button class="btn key del" data-k="del" aria-label="Xoá">⌫</button><button class="btn key go" data-k="enter">✔ <span data-t="done">Xong</span></button>
    </div>
    <div class="keypad" id="cmppad" hidden>
      <button class="btn key signKey" data-k="&gt;">&gt;<span class="lbl" data-t="gt">lớn hơn</span></button>
      <button class="btn key signKey" data-k="&lt;">&lt;<span class="lbl" data-t="lt">bé hơn</span></button>
      <button class="btn key signKey" data-k="=">=<span class="lbl" data-t="eqWord">bằng</span></button>
      <button class="btn key hintbtn" data-k="hint">💡 <span data-t="hint">Gợi ý</span></button>
    </div>
  </div>
</section>

<!-- KẾT QUẢ -->
<section id="end" class="screen" hidden>
  <div class="center">
    <h1 id="endTitle"></h1>
    <div class="result" id="endResult"></div>
    <div class="bigstars" id="endStars"></div>
    <div class="mistakes" id="endMistakes"></div>
    <div class="endBtns">
      <button class="btn again" id="againBtn">🔁 <span data-t="again">Chơi lại</span></button>
      <button class="btn back" id="backBtn">🏠 <span data-t="back">Trang chính</span></button>
    </div>
  </div>
</section>

<script>
(function () {
  "use strict";

  // ================= CẤP ĐỘ =================
  var LEVELS = [
    { id: "count",   vi: "Đếm hình (đến 10)",                    en: "Count the pictures (to 10)" },
    { id: "r5",      vi: "Cộng trừ trong phạm vi 5",             en: "Add & subtract within 5" },
    { id: "r10",     vi: "Cộng trừ trong phạm vi 10",            en: "Add & subtract within 10" },
    { id: "r20",     vi: "Cộng trừ trong phạm vi 20",            en: "Add & subtract within 20" },
    { id: "missing", vi: "Tìm số còn thiếu (3 + ? = 9)",         en: "Find the missing number (3 + ? = 9)" },
    { id: "cmp",     vi: "So sánh >, <, =",                      en: "Compare >, <, =" },
    { id: "three",   vi: "Phép tính 3 số (2 + 3 + 4)",           en: "Three numbers (2 + 3 + 4)" },
    { id: "tens",    vi: "Số tròn chục (20 + 30)",               en: "Tens (20 + 30)" },
    { id: "r100",    vi: "Cộng trừ không nhớ trong phạm vi 100", en: "Add & subtract within 100, no carrying" },
    { id: "word",    vi: "Toán có lời văn",                      en: "Word problems" }
  ];
  function levelIndex(id) { for (var i = 0; i < LEVELS.length; i++) if (LEVELS[i].id === id) return i; return -1; }

  // ================= CÀI ĐẶT =================
  var STORE_KEY = "be-hoc-toan-settings";
  var settings = { mode: "add", level: "r10", count: 10, hint: false, sound: true, voice: true, readQ: true, lang: "vi" };
  try {
    var saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if (saved) {
      for (var k in saved) { if (Object.prototype.hasOwnProperty.call(saved, k)) settings[k] = saved[k]; }
      if (!saved.level && saved.max) settings.level = saved.max == 5 ? "r5" : saved.max == 20 ? "r20" : "r10";
    }
  } catch (e) {}
  if (levelIndex(settings.level) < 0) settings.level = "r10";
  if (settings.lang !== "en") settings.lang = "vi";
  function saveSettings() { try { localStorage.setItem(STORE_KEY, JSON.stringify(settings)); } catch (e) {} }

  // ================= CHỮ HAI NGÔN NGỮ =================
  var T = {
    vi: {
      title: "Bé Học Toán 🧮", subtitle: "Chọn phép tính rồi bấm Bắt đầu nhé!",
      add: "Phép cộng", subtract: "Phép trừ", mix: "Cả hai", start: "Bắt đầu",
      settings: "Cài đặt cho bố mẹ", levelLabel: "Cấp độ", countLabel: "Số câu mỗi lượt", qUnit: "câu",
      alwaysHint: "Luôn hiện hình để đếm", soundLabel: "Nhạc và tiếng vỗ tay",
      voiceLabel: "Giọng nói khen", readQLabel: "Đọc to đề bài", test: "Nghe thử",
      tip: "Trên iPad/iPhone: tắt chế độ Im lặng để nghe được nhạc và giọng nói.",
      home: "Về", qLabel: "Câu", hint: "Gợi ý", done: "Xong", again: "Chơi lại", back: "Trang chính",
      gt: "lớn hơn", lt: "bé hơn", eqWord: "bằng",
      levelPrefix: "Cấp ", modeNoteCount: "Dạng Đếm hình không cần chọn phép tính.",

    },
    three: function () {
      var ops = settings.mode === "add" ? ["+", "+"] : settings.mode === "sub" ? ["−", "−"] : pick([["+", "−"], ["−", "+"], ["+", "+"], ["−", "−"]]);
      var a = 1, b = 2, c = 3, v = 6;
      for (var tries = 0; tries < 400; tries++) {
        var x = rnd(1, 9), y = rnd(1, 9), z = rnd(1, 9);
        var v1 = ap(x, ops[0], y); if (v1 < 0 || v1 > 10) continue;
        var v2 = ap(v1, ops[1], z); if (v2 < 0 || v2 > 10) continue;
        a = x; b = y; c = z; v = v2; break;
      }
      if (tries >= 400) ops = ["+", "+"];
      var e = pick(EMOJI);
      return eqQ([a, ops[0], b, ops[1], c, "=", v], 6, grp(a, e) + sgn(ops[0]) + grp(b, e) + sgn(ops[1]) + grp(c, e));
    },
    tens: function () {
      var op = opPick(), a, b;
      if (op === "+") { a = rnd(1, 9) * 10; b = rnd(1, (100 - a) / 10) * 10; }
      else { a = rnd(2, 10) * 10; b = rnd(1, a / 10 - 1) * 10; }
      return eqQ([a, op, b, "=", ap(a, op, b)], 4, tensPic(a, op, b));
    },
    r100: function () {
      var op = opPick(), a = 0, b = 0;
      for (var tries = 0; tries < 200; tries++) {
        var oneDigit = Math.random() < .4, ta, ua, tb, ub;
        if (op === "+") {
          ta = rnd(1, 8); ua = rnd(0, 8);
          if (oneDigit) { tb = 0; ub = rnd(1, 9 - ua); } else { tb = rnd(1, 9 - ta); ub = rnd(0, 9 - ua); }
        } else {
          ta = rnd(1, 9); ua = rnd(1, 9);
          if (oneDigit) { tb = 0; ub = rnd(1, ua); } else { tb = rnd(1, ta); ub = rnd(0, ua); }
        }
        a = ta * 10 + ua; b = tb * 10 + ub;
        if (a < 10 || b === 0 || (op === "−" && a === b)) continue;
        break;
      }
      return eqQ([a, op, b, "=", ap(a, op, b)], 4, tensPic(a, op, b));
    },
    count: function () {
      var n = rnd(1, 10); if (n < 3 && Math.random() < .6) n = rnd(3, 10);
      var it = pick(ITEMS), cells = "", numbered = "";
      for (var i = 0; i < n; i++) { cells += "<span>" + it.e + "</span>"; numbered += '<span class="numbered">' + it.e + "<b>" + (i + 1) + "</b></span>"; }
      return {
        display: "count", kind: "num", ans: n, pic: cells, hint: numbered,
        speakQ: t("howMany")(it), speakAns: t("thereAre")(n, it), full: it.e + " = " + n,
        key: "n" + n + it.e
      };
    },
    word: function () {
      var b; do { b = basic(10, true); } while (b.a < 2);
      var it = pick(ITEMS), L = settings.lang, text;
      if (b.op === "+") {
        var gv = pick(GIVERS[L]);
        text = L === "vi"
          ? "Có " + b.a + " " + it.vi + ". " + gv + " cho thêm " + b.b + " " + it.vi + ". Hỏi có tất cả mấy " + it.vi + "?"
          : "There are " + b.a + " " + it.en + ". " + gv + " gives you " + b.b + " more. How many " + it.en + " are there in all?";
      } else {
        text = L === "vi"
          ? "Có " + b.a + " " + it.vi + ". " + it.subVi.replace("{b}", b.b) + " Hỏi còn lại mấy " + it.vi + "?"
          : "There are " + b.a + " " + it.en + ". " + it.subEn.replace("{b}", b.b) + " How many " + it.en + " are left?";
      }
      var tokens = [b.a, b.op, b.b, "=", b.ans];
      return {
        display: "word", kind: "num", ans: b.ans, text: text, pic: sumPic(b.a, b.op, b.b, it.e),
        hint: '<span class="eqHint">' + b.a + " " + b.op + " " + b.b + " = ?</span>",
        speakQ: text, speakAns: t("answerIs") + b.ans + ". " + sayFull(tokens), full: fullText(tokens),
        key: "w" + tokens.join("") + it.e
      };
    }
  };
  function makeQuestion(prevKey) {
    var q, tries = 0, gen = GEN[settings.level] || GEN.r10;
    do { q = gen(); tries++; } while (q.key === prevKey && tries < 30);
    return q;
  }

  // ================= LÀM BÀI =================
  var CHEER_EMOJI = ["👏", "🎉", "🥳", "🌟", "👍", "🏆", "😍", "🙌"];
  var game = null, busy = false, token = 0;

  function startGame() {
    ensureAudio(); unlockSpeech();
    game = { idx: 0, correct: 0, streak: 0, mistakes: [], q: null, input: "", tries: 0, hintShown: false };
    token++; $("fx").innerHTML = "";
    show("game");
    nextQuestion();
  }
  function readQuestion() { if (game) speak(game.q.speakQ); }

  function renderProblem() {
    var q = game.q, html = "";
    var box = '<span class="answer' + (q.kind === "cmp" ? " sign" : "") + '" id="answer">&nbsp;</span>';
    if (q.display === "eq") {
      html = '<div class="eqline big">' + q.tokens.map(function (tok, i) {
        if (i === q.blank) return box;
        return typeof tok === "number" ? "<span>" + tok + "</span>" : '<span class="op">' + tok + "</span>";
      }).join("") + "</div>";
    } else if (q.display === "count") {
      html = '<div class="countPic">' + q.pic + '</div><div class="eqline mid">' + box + "</div>";
    } else {
      html = '<div class="wpText">' + q.text + '</div><div class="wpPic">' + q.pic + '</div><div class="eqline mid">' + box + "</div>";
    }
    $("problem").innerHTML = html;
    fitProblem();
  }
  function fitProblem() {
    var els = document.querySelectorAll("#problem .eqline");
    for (var i = 0; i < els.length; i++) {
      var el = els[i]; el.style.fontSize = "";
      var fs = parseFloat(getComputedStyle(el).fontSize), guard = 0;
      while (el.scrollWidth > el.clientWidth + 1 && fs > 22 && guard < 40) { fs *= 0.92; el.style.fontSize = fs + "px"; guard++; }
    }
  }
  window.addEventListener("resize", function () { if (current === "game") fitProblem(); });

  function nextQuestion() {
    busy = false;
    game.q = makeQuestion(game.q ? game.q.key : null);
    game.input = ""; game.tries = 0;
    game.hintShown = !!settings.hint;
    $("progress").textContent = t("qLabel") + " " + (game.idx + 1) + "/" + settings.count;
    $("stars").textContent = "⭐ " + game.correct;
    $("barFill").style.width = (game.idx / settings.count * 100) + "%";
    $("numpad").hidden = game.q.kind !== "num";
    $("cmppad").hidden = game.q.kind !== "cmp";
    renderProblem();
    setFeedback("", "");
    renderAnswer("");
    renderHint();
    if (settings.readQ || game.q.display === "word") readQuestion();
  }
  function renderAnswer(state) {
    var el = $("answer"); if (!el) return;
    var base = "answer" + (game.q.kind === "cmp" ? " sign" : "");
    el.className = base; void el.offsetWidth;
    if (state) el.className = base + " " + state;
    el.innerHTML = game.input === "" ? "&nbsp;" : game.input;
    fitProblem();
  }
  function setFeedback(text, cls) { var el = $("feedback"); el.textContent = text; el.className = "feedback" + (cls ? " " + cls : ""); }
  function renderHint() { $("hint").innerHTML = game.hintShown ? game.q.hint : ""; }

  function pressKey(k) {
    if (!game || busy) return;
    var q = game.q;
    if (k === "hint") { game.hintShown = true; renderHint(); soundTap(); return; }
    if (q.kind === "cmp") {
      if (k === ">" || k === "<" || k === "=") { game.input = k; soundTap(); renderAnswer(""); check(); }
      return;
    }
    if (k === "del") { game.input = game.input.slice(0, -1); renderAnswer(""); return; }
    if (k === "enter") { check(); return; }
    if (/^[0-9]$/.test(k)) {
      if (game.input.length >= 3) return;
      if (game.input === "0") game.input = "";
      game.input += k; soundTap(); renderAnswer(""); setFeedback("", "");
    }
  }
  function afterBoth(minMs, text, cb) {
    var my = token, left = 2;
    function step() { left--; if (left === 0 && my === token) cb(); }
    setTimeout(step, minMs);
    if (text) setTimeout(function () { if (my === token) speak(text, step); else step(); }, 250); else step();
  }
  function check() {
    var q = game.q;
    if (game.input === "") { setFeedback(t("typeNum"), "info"); return; }
    var ok = q.kind === "cmp" ? game.input === q.ans : parseInt(game.input, 10) === q.ans;
    if (ok) {
      busy = true;
      if (game.tries === 0) { game.correct++; game.streak++; } else game.streak = 0;
      var st = $("stars"); st.textContent = "⭐ " + game.correct; st.className = "stars"; void st.offsetWidth; st.className = "stars bump";
      renderAnswer("ok");
      var praise = pick(t("praise"));
      if (game.streak > 0 && game.streak % 3 === 0) praise = t("streak")(game.streak);
      setFeedback(praise, "ok");
      celebrate(pick(CHEER_EMOJI), praise.split("!")[0] + "!", true);
      soundCorrect();
      afterBoth(2100, praise, advance);
    } else {
      game.tries++; game.streak = 0; soundWrong(); busy = true;
      if (game.tries === 1) {
        renderAnswer("bad");
        var msg = t("wrong1");
        setFeedback(msg + " 🤔", "bad");
        celebrate("🤔", "", false);
        game.hintShown = true; renderHint();
        afterBoth(900, msg, function () { busy = false; game.input = ""; renderAnswer(""); });
      } else {
        game.mistakes.push(q.full);
        game.input = String(q.ans);
        renderAnswer("reveal");
        setFeedback(t("answerIs") + q.ans + ". " + t("nextTime") + " 💛", "info");
        game.hintShown = true; renderHint();
        afterBoth(3000, q.speakAns + " " + t("nextTime"), advance);
      }
    }
  }
  function advance() { if (!game) return; game.idx++; if (game.idx >= settings.count) finish(); else nextQuestion(); }

  function finish() {
    var total = settings.count, c = game.correct, ratio = c / total;
    var tier = ratio === 1 ? 0 : ratio >= .7 ? 1 : ratio >= .4 ? 2 : 3;
    var starCount = 3 - tier;
    $("endTitle").textContent = t("titles")[tier];
    $("endResult").textContent = t("result")(c, total);
    var html = "";
    for (var i = 0; i < 3; i++) html += '<span style="animation-delay:' + (0.3 + i * 0.35) + 's">' + (i < starCount ? "⭐" : "☆") + "</span>";
    $("endStars").innerHTML = html;
    $("endMistakes").innerHTML = game.mistakes.length ? t("review") + game.mistakes.map(function (m) { return "<b>" + m + "</b>"; }).join(" ") : "";
    $("barFill").style.width = "100%";
    show("end");
    game = null; $("fx").innerHTML = "";
    if (tier <= 2) { soundWin(); confetti(90, ["⭐", "🎉", "🏆", "✨", "👏"]); } else soundCorrect();
    var say = t("endSay")[tier](c, total);
    setTimeout(function () { speak(say); }, 600);
  }

  // ================= SỰ KIỆN =================
  $("startBtn").addEventListener("click", startGame);
  $("againBtn").addEventListener("click", startGame);
  $("backBtn").addEventListener("click", function () { stopSpeak(); show("home"); });
  $("homeBtn").addEventListener("click", function () { token++; game = null; busy = false; stopSpeak(); $("fx").innerHTML = ""; show("home"); });
  $("speakBtn").addEventListener("click", function () { ensureAudio(); readQuestion(); this.blur(); });
  var keys = document.querySelectorAll(".keypad .key");
  for (var j = 0; j < keys.length; j++) keys[j].addEventListener("click", function () { ensureAudio(); pressKey(this.getAttribute("data-k")); this.blur(); });

  document.addEventListener("keydown", function (e) {
    var k = e.key;
    if (current !== "game") { if (k === "Enter" && e.target.tagName !== "SELECT") { e.preventDefault(); startGame(); } return; }
    if (/^[0-9]$/.test(k) || k === ">" || k === "<" || k === "=") { e.preventDefault(); pressKey(k); }
    else if (k === "Backspace" || k === "Delete") { e.preventDefault(); pressKey("del"); }
    else if (k === "Enter") { e.preventDefault(); pressKey("enter"); }
    else if (k === " ") { e.preventDefault(); readQuestion(); }
  });

  // Dùng cho kiểm tra tự động
  window.__bht = { q: function () { return game && game.q; }, gen: GEN, settings: settings };

  show("home");
})();
</script>

  // Cho phép mở app khi không có mạng (sau lần mở đầu tiên)
  if ("serviceWorker" in navigator) { window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); }); }
</script>
